<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .profile-card {
            border-radius: 12px;
            padding: 25px;
            background: white;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }
        .avatar-box {
            width: 140px;
            height: 140px;
            background: #dcdcdc;
            border-radius: 8px;
        }
        .placeholder-bar {
            height: 55px;
            border-radius: 8px;
            background: #e0e0e0;
        }
        .top-header {
            height: 120px;
            background: #d7d7d7;
            border-radius: 0 0 0 12px;
        }
        .profile-circle {
            width: 55px;
            height: 55px;
            background: #343a40;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="top-header d-flex justify-content-end align-items-center px-4">
        <div class="profile-circle d-flex justify-content-center align-items-center text-white">
            G
        </div>
    </div>

    <div class="container my-5">
        <div class="row g-4 align-items-start">

            <div class="col-md-4 d-flex justify-content-center">
                <div class="avatar-box"></div>
            </div>

            <div class="col-md-8">
                <div class="profile-card">
                    <div class="mb-4">
                        <div class="fw-bold">Bio</div>
                        <div class="placeholder-bar mt-2"></div>
                    </div>

                    <div class="mb-4">
                        <div class="fw-bold">Interests</div>
                        <div class="placeholder-bar mt-2"></div>
                    </div>

                    <div>
                        <div class="fw-bold">Events Attending</div>
                        <div class="placeholder-bar mt-2"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <script>
        gsap.from(".top-header", { duration: 0.8, y: -80, opacity: 0, ease: "power3.out" })
        gsap.from(".avatar-box", { duration: 1, x: -50, opacity: 0, delay: 0.2, ease: "power3.out" })
        gsap.from(".profile-card", { duration: 1, x: 50, opacity: 0, delay: 0.3, ease: "power3.out" })
        gsap.from(".placeholder-bar", { duration: 1, opacity: 0, stagger: 0.15, delay: 0.4 })
    </script>

</body>
</html>
