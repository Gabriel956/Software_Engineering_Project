<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #111;
      overflow-x: hidden;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.5s ease;
    }

    .login-card {
      width: 360px;
      background: transparent;
      text-align: center;
    }

    h1.title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 26px;
      position: relative;
      display: inline-block;
      padding-bottom: 12px;
    }

    h1.title::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      height: 4px;
      width: 36px;
      background: #111;
      border-radius: 2px;
    }

    .form-control.custom-input {
      background: #dcdcdc;
      border: 0;
      height: 60px;
      border-radius: 2px;
      box-shadow: none;
      padding-left: 18px;
      padding-right: 18px;
    }

    .form-control.custom-input::placeholder {
      color: #7b7b7b;
    }

    .create-link {
      display: block;
      text-align: left;
      margin-top: 8px;
      margin-bottom: 18px;
      font-size: 12px;
      color: #0d6efd;
      text-decoration: none;
    }

    .btn-custom {
      background: #1e1e1e;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 26px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      font-size: 14px;
      min-width: 90px;
    }

    .btn-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 12px;
    }

    .events-section {
      
      padding: 40px 60px;
    }

    .topbar {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
    }

    .brand-box {
      width: 360px;
      height: 60px;
      background: #dbdbdb;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      text-decoration: none;
    }

    .events-grid {
      column-count: 2;
      column-gap: 70px;
      margin-top: 20px;
    }

    .event-card {
      display: flex;
      background: #e2e2e2;
      padding: 18px;
      margin-bottom: 28px;
      align-items: center;
      gap: 16px;
      break-inside: avoid;
    }

    .event-thumb {
      width: 86px;
      height: 86px;
      background: #111;
    }

    .event-meta {
      flex: 1;
    }

    .event-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      text-decoration: none;
    }

    .event-desc {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .event-date {
      font-size: 13px;
      color: #333;
    }

    @media(max-width:1000px) {
      .events-grid {
        column-count: 1;
      }
    }
  </style>

    
</head>
<body>

<div class="events-section" id="eventsSection">
    <div class="topbar">
      <div class="brand-box">
        <h1>All Events</h1>
        <p><a href="/events/create/">Create New Event</a></p>
        <p><a href="/admin/">Go to admin</a></p>
      </div>
      <a href="{% url 'profile' %}" style="text-decoration: none;">
      <button class="avatar btn bun-custom" >G</button>
      </a>
    </div>

    <div class="events-grid">


      
      {% if events %}

      {% for event in events %}
      <div class="event-card">
        <div class="event-thumb"></div>
        <div class="event-meta">
          <a href="{% url 'event_detail' event.id %}" style="text-decoration: none;">
            <div class="event-title">{{event.title}}</div>
          </a>
          <div class="event-desc">{{event.description}}</div>
          <div class="event-date">{{event.starts_at}} at {{event.location}}</div>
        </div>
      </div>
      {% endfor %}

      {% else %}
        <div>
          No events yet.
        </div>
      {% endif %}

    </div>
  </div>





  

</body>
</html>
