<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      min-height: 100vh;
      font-family: Poppins, system-ui, sans-serif;
      color: white;
    }

    .top-header {
      height: 90px;
      background: rgba(15,23,42,.95);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 2rem;
    }

    .profile-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .avatar-box {
      width: 160px;
      height: 160px;
      border-radius: 1rem;
      background: linear-gradient(135deg, #111827, #1f2933);
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
    }

    .profile-card {
      background: rgba(255,255,255,0.06);
      border-radius: 1.75rem;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(16px);
      padding: 2.5rem;
    }

    .section-title {
      font-weight: 600;
      margin-bottom: .6rem;
    }

    .placeholder-bar {
      height: 50px;
      border-radius: .75rem;
      background: rgba(255,255,255,.12);
    }
  </style>
</head>

<body>

<div class="top-header">
  <div class="profile-circle">G</div>
</div>

<div class="container py-5">
  <div class="row g-4 align-items-center">

    <div class="col-md-4 text-center">
      <div class="avatar-box mx-auto"></div>
    </div>

    <div class="col-md-8">
      <div class="profile-card">

        <div class="mb-4">
          <div class="section-title">Bio</div>
          <div class="placeholder-bar"></div>
        </div>

        <div class="mb-4">
          <div class="section-title">Interests</div>
          <div class="placeholder-bar"></div>
        </div>

        <div>
          <div class="section-title">Events Attending</div>
          <div class="placeholder-bar"></div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  gsap.from(".top-header", { y:-80, opacity:0, duration:1 })
  gsap.from(".avatar-box", { x:-40, opacity:0, duration:1, delay:.2 })
  gsap.from(".profile-card", { x:40, opacity:0, duration:1, delay:.3 })
  gsap.from(".placeholder-bar", { opacity:0, stagger:.15, delay:.6 })
</script>

</body>
</html>
