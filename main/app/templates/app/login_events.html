<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In the Works — Login</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: linear-gradient(135deg, #ff4e00, #ec2f2f); /* BLOOD ORANGE GRADIENT */
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color: #111;
    overflow-x: hidden;
  }

  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 0.5s ease;
  }

.login-card {
  width: 360px;
  text-align: center;
  padding: 30px 28px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.17);  /* translucent white */
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(10px);            /* frosted-glass effect */
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.35);
}

  h1.title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 26px;
    position: relative;
    display: inline-block;
    padding-bottom: 12px;
  }

  h1.title::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    height: 4px;
    width: 36px;
    background: #111;
    border-radius: 2px;
  }

  .form-control.custom-input {
    background: #dcdcdc;
    border: 0;
    height: 60px;
    border-radius: 2px;
    padding: 0 18px;
  }

  .form-control.custom-input::placeholder {
    color: #7b7b7b;
  }

  .create-link {
    display: block;
    text-align: left;
    margin-top: 8px;
    margin-bottom: 18px;
    font-size: 12px;
    color: #000000;
    text-decoration: none;
  }

  .btn-custom {
    background: #1e1e1e;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 10px 26px;
    font-size: 14px;
    min-width: 90px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 12px;
  }

  .app-title {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.35);
  margin-bottom: 10px;
}

</style>

</head>

<body>

  <div class="login-wrap" id="loginWrap">

    <!-- Centered App Title -->
    <div class="page-title text-center mb-4">
      <h1 class="app-title">Vaqueros Meets</h1>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <h1 class="title">Login</h1>

      <form class="px-4" method="post" action="{% url 'login_events' %}">
        {% csrf_token %}

        {% if error %}
          <p style="color: red; font-size: 0.9rem;">{{ error }}</p>
        {% endif %}

        <div class="mb-3">
          <input type="text"
                 class="form-control custom-input"
                 name="username"
                 placeholder="Username"
                 required>
        </div>

        <div class="mb-1">
          <input type="password"
                 class="form-control custom-input"
                 name="password"
                 placeholder="Password"
                 required>
        </div>

        <a href="#" class="create-link">Create Account</a>

        <div class="btn-row">
          <button type="button" class="btn btn-custom" id="signup">Sign Up</button>
          <button type="submit" class="btn btn-custom" id="login">Login</button>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    gsap.from('.app-title', { y: -20, opacity: 0, duration: 0.6 });
    gsap.from('.title', { y: -15, opacity: 0, duration: 0.6, delay: 0.1 });
    gsap.from('.custom-input', { y: 20, opacity: 0, stagger: 0.15, delay: 0.2 });
    gsap.from('.create-link', { opacity: 0, y: 10, delay: 0.4 });
    gsap.from('.btn-row button', { opacity: 0, y: 15, stagger: 0.1, delay: 0.5 });
  </script>

</body>

</html>
