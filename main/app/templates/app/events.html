<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #fff;
      min-height: 100vh;
    }
    .navbar {
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .profile-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .event-card {
      background: rgba(255,255,255,0.05);
      border-radius: 1.75rem;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 60px rgba(0,0,0,.4);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }
    .event-image {
      height: 100%;
      min-height: 260px;
      background: linear-gradient(135deg, #111827, #1f2933);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: rgba(255,255,255,.4);
    }
    .event-info {
      padding: 2.5rem;
    }
    .badge-category {
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      font-size: .85rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border: none;
      border-radius: .75rem;
      padding: .65rem 1.2rem;
      font-weight: 600;
    }
    .btn-outline-light {
      border-radius: .75rem;
    }
    .event-meta span {
      display: block;
      font-size: .9rem;
      opacity: .85;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-4" href="#">InTheWorks</a>
    <div class="ms-auto">
      <div class="profile-circle">G</div>
    </div>
  </div>
</nav>

<div class="container py-5 mt-4">
  <h1 class="fw-bold mb-4">Upcoming Event</h1>

  <div class="event-card row g-0 align-items-stretch">
    <div class="col-md-4">
      <div class="event-image">Event Image</div>
    </div>

    <div class="col-md-8">
      <div class="event-info">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h2 class="fw-bold mb-1">Campus Game Night</h2>
            <span class="badge-category">Gaming</span>
          </div>
          <span class="fw-semibold text-info">Free</span>
        </div>

        <p class="mb-4 opacity-75">
          Join us for a fun night of board games, video games, and food with fellow students.
          Meet new people, make friends, and unwind together.
        </p>

        <div class="row event-meta mb-4">
          <div class="col-sm-4">
            <span class="fw-semibold">Date</span>
            <span>Oct 22, 2025</span>
          </div>
          <div class="col-sm-4">
            <span class="fw-semibold">Time</span>
            <span>6:00 PM</span>
          </div>
          <div class="col-sm-4">
            <span class="fw-semibold">Location</span>
            <span>Student Union Hall</span>
          </div>
        </div>

        <div class="d-flex gap-3">
          <button class="btn btn-outline-light">Save</button>
          <button class="btn btn-primary">RSVP</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  gsap.from(".navbar", { y: -80, opacity: 0, duration: 1 });
  gsap.from("h1", { y: 40, opacity: 0, duration: 1, delay: .4 });
  gsap.from(".event-card", { scale: .9, opacity: 0, duration: 1, delay: .8, ease: "power3.out" });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
