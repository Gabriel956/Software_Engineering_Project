<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login & Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      font-family: Poppins, system-ui, sans-serif;
      color: white;
      overflow-x: hidden;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.5s ease;
    }

    .login-card {
      width: 380px;
      background: rgba(255,255,255,0.06);
      border-radius: 1.75rem;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(16px);
      padding: 2.5rem;
      text-align: center;
    }

    h1.title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 26px;
    }

    .form-control.custom-input {
      background: rgba(255,255,255,.12);
      border: none;
      height: 60px;
      border-radius: .75rem;
      box-shadow: none;
      padding-left: 18px;
      padding-right: 18px;
      color: white;
    }

    .form-control.custom-input::placeholder {
      color: rgba(255,255,255,.6);
    }

    .create-link {
      display: block;
      text-align: left;
      margin-top: 8px;
      margin-bottom: 18px;
      font-size: 12px;
      color: #38bdf8;
      text-decoration: none;
    }

    .btn-custom {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
      border: none;
      border-radius: .75rem;
      padding: 10px 26px;
      font-size: 14px;
      min-width: 90px;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 12px;
    }

    .events-section {
      display: none;
      padding: 40px 60px;
    }

    .topbar {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      background: rgba(15,23,42,.95);
    }

    .brand-box {
      width: 240px;
      height: 48px;
      border-radius: .75rem;
      background: rgba(255,255,255,.12);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .events-grid {
      column-count: 2;
      column-gap: 70px;
      margin-top: 30px;
    }

    .event-card {
      display: flex;
      background: rgba(255,255,255,0.06);
      padding: 20px;
      margin-bottom: 28px;
      align-items: center;
      gap: 16px;
      break-inside: avoid;
      border-radius: 1.25rem;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
      backdrop-filter: blur(12px);
    }

    .event-thumb {
      width: 86px;
      height: 86px;
      border-radius: .75rem;
      background: linear-gradient(135deg, #111827, #1f2933);
    }

    .event-meta {
      flex: 1;
    }

    .event-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 13px;
      margin-bottom: 10px;
      opacity: .8;
    }

    .event-date {
      font-size: 13px;
      opacity: .7;
    }

    @media(max-width:1000px) {
      .events-grid {
        column-count: 1;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <h1 class="title">Login</h1>
      <form class="px-2" method="post" action="{% url 'login_events' %}">
  {% csrf_token %}

  {% if error %}
    <p style="color: #fca5a5; font-size: 0.9rem; text-align: left;">
      {{ error }}
    </p>
  {% endif %}

  <div class="mb-3">
    <input type="text"
           class="form-control custom-input"
           name="username"
           placeholder="Username"
           required>
  </div>
  <div class="mb-1">
    <input type="password"
           class="form-control custom-input"
           name="password"
           placeholder="Password"
           required>
  </div>

  <a href="{% url 'signup' %}" class="create-link">Create Account</a>

  <div class="btn-row">
    <a href="{% url 'signup' %}" class="btn btn-custom" id="signup">Sign Up</a>
    <button type="submit" class="btn btn-custom" id="login">Login</button>
  </div>
</form>

    </div>
  </div>

  <div class="events-section" id="eventsSection">
    <div class="topbar">
      <div class="brand-box"></div>
      <div class="avatar">G</div>
    </div>

    <div class="events-grid">
      <div class="event-card">
        <div class="event-thumb"></div>
        <div class="event-meta">
          <div class="event-title">Title</div>
          <div class="event-desc">Description of Event</div>
          <div class="event-date">Date / Time</div>
        </div>
      </div>

      <div class="event-card">
        <div class="event-thumb"></div>
        <div class="event-meta">
          <div class="event-title">Title</div>
          <div class="event-desc">Description of Event</div>
          <div class="event-date">Date / Time</div>
        </div>
      </div>

      <div class="event-card">
        <div class="event-thumb"></div>
        <div class="event-meta">
          <div class="event-title">Title</div>
          <div class="event-desc">Description of Event</div>
          <div class="event-date">Date / Time</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    gsap.from('.title', { y: -20, opacity: 0, duration: 0.6 });
    gsap.from('.custom-input', { y: 20, opacity: 0, stagger: 0.15 });
    gsap.from('.create-link', { opacity: 0, y: 10, delay: 0.4 });
    gsap.from('.btn-row button', { opacity: 0, y: 15, stagger: 0.1, delay: 0.5 });

  </script>

</body>
</html>
