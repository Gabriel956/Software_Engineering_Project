<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Comment — InTheWorks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      min-height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #e5e7eb;
      margin: 0;
    }

    .navbar {
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    .profile-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }

    .page-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card-glass {
      width: 100%;
      max-width: 550px;
      background: rgba(255,255,255,0.06);
      border-radius: 1.75rem;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(16px);
      padding: 2rem 2.5rem;
    }

    textarea {
      width: 100%;
      background: rgba(15,23,42,.85);
      border: 1px solid rgba(148,163,184,.7);
      border-radius: .75rem;
      padding: 0.6rem 0.9rem;
      color: #e5e7eb;
      min-height: 120px;
      resize: vertical;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border: none;
      border-radius: .75rem;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-outline-light {
      border-radius: .75rem;
      font-size: 0.9rem;
      padding: 0.5rem 1.2rem;
    }

    a.link-muted {
      color: #93c5fd;
      font-size: 0.85rem;
      text-decoration: none;
    }
    a.link-muted:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-4" href="{% url 'event_list' %}">Vaqueros Meets</a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="{% url 'profile' %}" class="text-decoration-none text-white">
          <div class="profile-circle">{{ initial }}</div>
        </a>

        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
          Sign out
        </a>
      </div>
    </div>
  </nav>
  <!-- END NAVBAR -->
  <!-- PAGE CONTENT -->
  <div class="page-wrap">
    <div class="card-glass">
      <h2 class="h5 mb-3">Edit your comment</h2>
      <p class="mb-4 text-muted" style="font-size: 0.9rem;">
        Make any changes you’d like, then save to update your comment.
      </p>

      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="mb-3">
          {{ form.text.errors }}
          {{ form.text }}
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="{% url 'event_detail' comment.event.id %}" class="btn btn-outline-light">
            Cancel
          </a>

          <button type="submit" class="btn btn-primary">
            Save changes
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
