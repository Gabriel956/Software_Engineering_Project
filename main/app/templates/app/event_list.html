<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Events</title>
</head>
<body>

  <h1>All Events</h1>

  <p><a href="/events/create/">Create New Event</a></p>

  {% if events %}
    <ul>
      {% for event in events %}
        <li>
          <a href="{% url 'event_detail' event.id %}">
            {{ event.title }}
          </a>
          — {{ event.starts_at }} at {{ event.location }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No events yet.</p>
  {% endif %}

  <p><a href="/admin/">Go to admin</a></p>

</body>
</html>
